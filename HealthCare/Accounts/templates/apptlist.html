<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare - Appointments Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
        }

        .badge-confirmed {
            background-color: #28a745;
        }

        .badge-pending {
            background-color: #ffc107;
            color: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>HealthCare Portal</h1>
        <!-- Optional: Add a logout link if you implement it later -->
        <a href="{% url 'login' %}" class="logout-btn">Logout</a>
    </header>

    <div class="container">
        <h2>Doctor's Appointments List</h2>
        <p>Welcome back! Here are your scheduled appointments:</p>

        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John Doe</td>
                    <td>2026-08-25</td>
                    <td>10:00 AM</td>
                    <td><span class="badge badge-confirmed">Confirmed</span></td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>2026-08-25</td>
                    <td>11:30 AM</td>
                    <td><span class="badge badge-pending">Pending</span></td>
                </tr>
                <tr>
                    <td>Robert Johnson</td>
                    <td>2026-08-26</td>
                    <td>02:00 PM</td>
                    <td><span class="badge badge-confirmed">Confirmed</span></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
